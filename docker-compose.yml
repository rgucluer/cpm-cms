services:
  payload:
    container_name: payload
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    pull_policy: build
    image: custom-payload-website:3.85-build.18
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    environment:
      - 'NODE_ENV=production'
    healthcheck:
      test: 'wget -qO- http://127.0.0.1:3000 > /dev/null || exit 1'
      # test: 'true'
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 45s
    expose:
      - 3000 
    working_dir: /app/
    command: 'sh -c "node server.js"'
    labels:
      traefik.enable: true
      coolify.managed: true
      coolify.proxy: true


