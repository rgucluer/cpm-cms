services:
  payload:
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    pull_policy: build
    image: custom-payload-website:3.85-build.21
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    environment:
      - 'NODE_ENV=production'
    healthcheck:
      # test: 'wget -qO- http://127.0.0.1:3000 > /dev/null || exit 1'
      test: 'true'
      interval: 1m
      timeout: 5s
      retries: 15
      # Build takes at least 9 minutes
      start_period: 20s
    expose:
      - 3000 
    working_dir: /home/node/app/
    # command: 'sh -c "node server.js"'
    # command: 'sh -c "tail -f /dev/null"'
    command: >
      sh -c '
      if [ -f ./server.js ]; then
        node ./server.js;
      else 
        tail -f /dev/null;
      fi
      '
    labels:
      traefik.enable: true
      coolify.managed: true
      coolify.proxy: true


